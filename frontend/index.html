  <body style="margin: 0; background-color: #070B14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <!-- Sofortiger nativer HAVN Ladebildschirm -->
    <div id="havn-loader" style="
      position: fixed;
      inset: 0;
      background-color: #070B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    ">
      <div style="position: relative; width: 88px; height: 88px; margin-bottom: 24px;">
        <!-- Pulsierender Scheinwerfer-Glow -->
        <div style="
          position: absolute;
          inset: -12px;
          border-radius: 28px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(7, 11, 20, 0) 70%);
          animation: pulseGlow 2s infinite ease-in-out;
        "></div>
        <img 
          src="/apple-touch-icon.png" 
          alt="HAVN" 
          style="
            width: 88px;
            height: 88px;
            border-radius: 22px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.3);
            border: none;
            position: relative;
          "
        />
      </div>

      <div style="text-align: center; space-y: 6px;">
        <div style="color: #ffffff; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 4px;">
          HAVN
        </div>
        <div style="color: #38bdf8; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;">
          Dein sicherer Hafen für Aktien & ETFs
        </div>
      </div>

      <!-- Moderner Ladebalken -->
      <div style="width: 140px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; margin-top: 24px; overflow: hidden; position: relative;">
        <div style="
          position: absolute;
          top: 0;
          bottom: 0;
          width: 50%;
          background: linear-gradient(90deg, #38bdf8, #10b981);
          border-radius: 999px;
          animation: loaderAnim 1.4s infinite ease-in-out;
        "></div>
      </div>
    </div>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(0.95); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes loaderAnim {
        0% { left: -50%; }
        100% { left: 150%; }
      }
    </style>

    <!-- Crawler-Fallback & Statischer SEO-Inhalt für Googlebot & Suchmaschinen -->
    <noscript>
      <div style="padding: 2.5rem 1.5rem; color: #f8fafc; background-color: #070B14; font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 860px; margin: 0 auto; line-height: 1.6;">
        <h1 style="color: #38bdf8; font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem;">HAVN Finance — Dein sicherer Hafen für Aktien &amp; ETFs</h1>
        <p style="font-size: 1.1rem; color: #94a3b8;">
          <strong>HAVN Finance</strong> ist die High-End Plattform für quantitative Portfolio-Analysen, reale historische Krisen-Stresstests, mathematische Zinseszins-Sparpläne und faktenbasierte Asset-Duelle für Aktien, ETFs und Krypto.
        </p>
        <h2 style="color: #ffffff; font-size: 1.3rem; margin-top: 1.5rem;">Hauptfunktionen von HAVN Finance:</h2>
        <ul style="color: #cbd5e1; padding-left: 1.25rem;">
          <li><strong>⚓ Hafen (Terminal):</strong> Ganzheitliche Quant-Analyse mit 6 institutionellen Modellen, Markt-Beta, Volatilität und 5.000 Pfade Simulationsfächer.</li>
          <li><strong>🌊 Sturm (Krisen-Simulator):</strong> Verfolge den echten historischen Börsenkurs während Corona 2020, Weltfinanzkrise 2008 oder Dotcom-Crash 2000 und sieh, wie Sparpläne Krisen abfedern.</li>
          <li><strong>🧭 Kompass (Sparziel-Planer):</strong> Berechne Zinseszins-Strategien für Notgroschen, passives Nebeneinkommen, Immobilien-Eigenkapital und finanzielle Freiheit.</li>
          <li><strong>⚔️ Duell (Asset-Vergleich):</strong> Kopf-an-Kopf Vergleich zweier Wertpapiere nach Rendite, Krisenfestigkeit, Streuung und Sparplan-Eignung.</li>
          <li><strong>📖 Logbuch (Academy):</strong> Wissenschaftlich fundiertes Finanzwissen für Einsteiger und Pro-Anleger ohne Finanz-Chinesisch.</li>
        </ul>
        <p style="margin-top: 1.5rem; color: #94a3b8;">
          Offizielle Website: <a href="https://havn-finance.com" style="color: #38bdf8; text-decoration: underline;">https://havn-finance.com</a>
        </p>
      </div>
    </noscript>

    <div id="root">
      <!-- Prerender Semantic Skeleton for Search Engines -->
      <header style="display:none;" aria-hidden="true">
        <h1>HAVN Finance — Quantitative Portfolio- und Risikoanalyse für Aktien und ETFs</h1>
        <p>Dein sicherer Hafen für fundierte Investmententscheidungen und Zinseszins-Vermögensaufbau.</p>
      </header>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Entferne den Ladescreen weich, sobald React gemountet ist
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('havn-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 400);
          }
        }, 300);
      });

      // Registriere den Service Worker für PWA Offline-Support & High-Speed Cache
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[HAVN] Service Worker aktiv mit Scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[HAVN] Service Worker Registrierung fehlgeschlagen:', err);
            });
        });
      }
    </script>
